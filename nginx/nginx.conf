upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location /health {
        proxy_pass http://backend_upstream/health;
    }

    location /auth/ {
        proxy_pass http://backend_upstream/auth/;
    }

    location /nutrition {
        proxy_pass http://backend_upstream;
    }

    location /lecture {
        proxy_pass http://backend_upstream;
    }

    location /yolo/ {
        proxy_pass http://backend_upstream/yolo/;
    }

    location /docs {
        proxy_pass http://backend_upstream/docs;
    }

    location /redoc {
        proxy_pass http://backend_upstream/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}